name: 'gsaf'
version: '1.0.0'
config-version: 2

# Matches the profile name in profiles.yml -- dbt uses this to find which
# connection details to use when it runs.
profile: 'gsaf'

model-paths: ["models"]

models:
  gsaf:
    staging:
      # 'view' keeps this cheap and always fresh -- every query against it
      # re-reads the current month's table live, no separate storage cost,
      # no separate refresh step needed beyond the dbt run itself.
      +materialized: view

# NOTE: Elementary was removed. Its internal models default to
# 'incremental' materialization, which compiles to MERGE (DML) --
# BigQuery sandbox blocks all DML without a linked billing account, and
# this proved to be baked into Elementary's snapshot-based models with
# no config override available. Observability is now handled by
# observability.py, which uses WRITE_APPEND load jobs (not DML) to log
# freshness/schema-change/row-count-anomaly checks to
# sharks.pipeline_observability instead.
