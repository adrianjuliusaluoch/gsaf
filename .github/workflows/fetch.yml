name: Upload Shark Data to BigQuery
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch_and_load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Set up Google Cloud credentials
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}'
      - name: Run pipeline
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 2
          retry_wait_seconds: 30
          retry_on: error
          command: python fetch_and_load.py
      - name: Install dbt
        run: pip install dbt-bigquery
      - name: Install dbt packages (Elementary)
        run: dbt deps --profiles-dir ./dbt --project-dir ./dbt
      - name: Set dynamic BigQuery table name
        run: |
          SUFFIX=$(date +'%Y_%b' | tr '[:upper:]' '[:lower:]')
          echo "DBT_SHARK_TABLE=data-storage-485106.sharks.attacks_${SUFFIX}" >> $GITHUB_ENV
      - name: Install packages and run dbt build
        uses: nick-fields/retry@v3
        env:
          DBT_SHARK_TABLE: ${{ env.DBT_SHARK_TABLE }}
        with:
          timeout_minutes: 5
          max_attempts: 2
          retry_wait_seconds: 30
          retry_on: error
          command: >
            dbt deps --profiles-dir ./dbt --project-dir ./dbt &&
            dbt build --profiles-dir ./dbt --project-dir ./dbt
