name: Upload Shark Data to BigQuery

on:
  workflow_dispatch:
  
permissions:
  contents: write
jobs:
  fetch_and_load:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Set up Google Cloud credentials
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}'
      - name: Run pipeline
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          retry_on: error
          command: python fetch_and_load.py
      - name: Update and commit fetch_and_load.py
        run: |
          # Add or update a timestamp comment at top of file
          sed -i "1s|^# Last run:.*|# Last run: $(date -u)|; 1t; 1i # Last run: $(date -u)" fetch_and_load.py
          git config --global user.name "adrianjuliusaluoch"
          git config --global user.email "adrianjuliusaluoch@gmail.com"
          git add fetch_and_load.py
          git commit -m "Keep workflow alive [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push
        continue-on-error: true
